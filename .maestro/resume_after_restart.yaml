# Week 3 milestone, automated: start a puzzle, kill the app, reopen,
# and prove the puzzle resumed from its save.
#
# Run on the iOS simulator or an Android emulator (same app ID on both):
#   maestro test .maestro/resume_after_restart.yaml
#
# Maestro can't see inside the Flame canvas (one opaque "Puzzle board"
# element), so drag/snap stays in the Dart tests. This flow asserts resume
# via the "In progress" label in the size picker, plus the board's own
# semantics label, which says whether the game restored a save ("resumed")
# or silently started over ("new puzzle").
appId: com.lexy5251.jigsawpuzzle
---
# Fresh install state so the flow is repeatable.
- launchApp:
    clearState: true
- assertVisible: "Choose a puzzle"

# Catalog images live on per-category pages: open Landscapes first, then
# scroll its grid to the image.
- scrollUntilVisible:
    element:
      id: "category-landscapes"
    direction: DOWN
- tapOn:
    id: "category-landscapes"
- scrollUntilVisible:
    element:
      id: "catalog-puzzle-alpine-lakes-panorama"
    direction: DOWN
- tapOn:
    id: "catalog-puzzle-alpine-lakes-panorama"

# Pick the easiest size, then launch with the sheet's button (size rows
# only select since the 2026-11-13 redesign). No save yet: fresh board.
- assertNotVisible:
    id: "puzzle-in-progress-alpine-lakes-panorama-5x5"
- tapOn:
    id: "puzzle-size-alpine-lakes-panorama-5x5"
- tapOn:
    id: "puzzle-start"
- assertVisible: "Puzzle board, new puzzle"

# Kill the app completely, then relaunch WITHOUT clearing state.
- stopApp
- launchApp
- assertVisible: "Choose a puzzle"

# The save must have survived the kill: the size picker marks it.
- scrollUntilVisible:
    element:
      id: "category-landscapes"
    direction: DOWN
- tapOn:
    id: "category-landscapes"
- scrollUntilVisible:
    element:
      id: "catalog-puzzle-alpine-lakes-panorama"
    direction: DOWN
- tapOn:
    id: "catalog-puzzle-alpine-lakes-panorama"
- assertVisible:
    id: "puzzle-in-progress-alpine-lakes-panorama-5x5"
    text: "In progress"

# And it actually reopens into the saved puzzle — "resumed" proves the game
# restored the save rather than starting a fresh board.
- tapOn:
    id: "puzzle-size-alpine-lakes-panorama-5x5"
- tapOn:
    id: "puzzle-start"
- assertVisible: "Puzzle board, resumed"
